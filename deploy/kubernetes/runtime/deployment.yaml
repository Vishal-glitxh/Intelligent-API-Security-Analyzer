apiVersion: apps/v1
kind: Deployment
metadata:
  name: iasa-api
  namespace: iasa
  labels:
    app.kubernetes.io/name: iasa-api
    app.kubernetes.io/part-of: intelligent-api-security-analyzer
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iasa-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iasa-api
        app.kubernetes.io/part-of: intelligent-api-security-analyzer
    spec:
      serviceAccountName: iasa-api
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 390
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: iasa-api
      containers:
        - name: api
          image: iasa-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: iasa-api-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: iasa-api-secrets
                  key: DATABASE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: iasa-api-secrets
                  key: SESSION_SECRET
            - name: API_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: iasa-api-secrets
                  key: API_ACCESS_TOKEN
            - name: API_CLIENT_TOKENS
              valueFrom:
                secretKeyRef:
                  name: iasa-api-secrets
                  key: API_CLIENT_TOKENS
                  optional: true
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: iasa-object-storage-credentials
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: iasa-object-storage-credentials
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: iasa-object-storage-credentials
                  key: AWS_SESSION_TOKEN
                  optional: true
            - name: UV_CACHE_DIR
              value: /tmp/uv-cache
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 1Gi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: scratch
              mountPath: /app/scratch
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
