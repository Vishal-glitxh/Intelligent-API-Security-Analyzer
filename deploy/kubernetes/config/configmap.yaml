apiVersion: v1
kind: ConfigMap
metadata:
  name: iasa-api-config
  namespace: iasa
data:
  ENVIRONMENT: production
  LOCAL_DEV_AUTH_BYPASS: "false"
  CORS_ORIGINS: https://app.example.invalid
  LOCAL_AI_ENABLED: "false"
  SCAN_WORKERS_ENABLED: "true"
  SCAN_WORKER_COUNT: "1"
  MAX_WORKER_PROCESSES: "2"
  SCAN_TIMEOUT_SECONDS: "300"
  SCAN_LEASE_GRACE_SECONDS: "60"
  SCAN_JOB_MAX_ATTEMPTS: "3"
  SCAN_WORKER_POLL_INTERVAL_SECONDS: "1"
  UPLOAD_RESERVATION_TTL_SECONDS: "900"
  UPLOAD_READ_TIMEOUT_SECONDS: "120"
  MAX_ACTIVE_SCANS: "10"
  MAX_CONCURRENT_SCANS_PER_CLIENT: "2"
  MAX_CONCURRENT_UPLOADS: "4"
  MAX_CONCURRENT_UPLOADS_PER_CLIENT: "2"
  SCAN_RATE_LIMIT_REQUESTS: "20"
  SCAN_RATE_LIMIT_WINDOW_SECONDS: "60"
  ARTIFACT_STORAGE_BACKEND: s3
  ARTIFACT_STORAGE_BUCKET: ""
  ARTIFACT_STORAGE_PREFIX: iasa
  ARTIFACT_STORAGE_REGION: ""
  ARTIFACT_STORAGE_ENDPOINT_URL: ""
