apiVersion: batch/v1
kind: Job
metadata:
  name: iasa-db-migration-replace-with-release-id
  namespace: iasa
  labels:
    app.kubernetes.io/name: iasa-db-migration
    app.kubernetes.io/part-of: intelligent-api-security-analyzer
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iasa-db-migration
    spec:
      restartPolicy: Never
      serviceAccountName: iasa-api
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: iasa-api:local
          imagePullPolicy: IfNotPresent
          command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: iasa-api-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: iasa-api-secrets
                  key: DATABASE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: iasa-api-secrets
                  key: SESSION_SECRET
            - name: API_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: iasa-api-secrets
                  key: API_ACCESS_TOKEN
            - name: UV_CACHE_DIR
              value: /tmp/uv-cache
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
