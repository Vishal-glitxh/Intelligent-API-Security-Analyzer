[project]
name = "intelligent-api-security-analyzer"
version = "0.1.0"
description = "Defensive, evidence-based static analysis for REST API security."
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20,<2",
    "fastapi>=0.141,<0.142",
    "openapi-spec-validator>=0.9,<0.10",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2,<3",
    "pwdlib[argon2]>=0.2,<1",
    "pyyaml>=6,<7",
    "sqlalchemy>=2,<2.1",
    "uvicorn[standard]>=0.35,<1",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.17,<2",
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["backend/alembic/versions", "backend/tests/fixtures"]


[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]


[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = ["backend"]
exclude = ["^backend/tests/fixtures/.*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q --strict-markers"
