name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: api_security
          POSTGRES_USER: analyzer
          POSTGRES_PASSWORD: analyzer
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy backend
      - run: uv run pip-audit
      - run: uv run bandit -r backend/app -lll -q
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -v --cov=backend/app --cov-report=term-missing
      - run: docker build --tag intelligent-api-security-analyzer:ci .
