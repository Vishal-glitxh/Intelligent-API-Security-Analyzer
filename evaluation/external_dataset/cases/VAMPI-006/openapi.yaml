openapi: 3.0.1
info:
  title: "VAmPI Benchmark \u2014 VAMPI-006"
  description: Curated external benchmark case VAMPI-006 from erev0s/VAmPI
  version: '0.1'
servers:
- url: http://localhost:5000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /me:
    get:
      summary: Display information about currently logged-in user
      operationId: api_views.users.me
      security:
      - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
                    properties:
                      username:
                        type: string
                      email:
                        type: string
                      admin:
                        type: boolean
        '401':
          description: Unauthorized
