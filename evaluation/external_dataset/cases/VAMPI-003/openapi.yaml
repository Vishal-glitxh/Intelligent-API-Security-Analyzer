openapi: 3.0.1
info:
  title: "VAmPI Benchmark \u2014 VAMPI-003"
  description: Curated external benchmark case VAMPI-003 from erev0s/VAmPI
  version: '0.1'
servers:
- url: http://localhost:5000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /users/v1:
    get:
      summary: Retrieves all users
      operationId: api_views.users.get_all_users
      responses:
        '200':
          description: Basic info about all users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        username:
                          type: string
                        email:
                          type: string
