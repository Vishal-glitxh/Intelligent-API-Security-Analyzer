openapi: 3.0.1
info:
  title: "VAmPI Benchmark \u2014 VAMPI-007"
  description: Curated external benchmark case VAMPI-007 from erev0s/VAmPI
  version: '0.1'
servers:
- url: http://localhost:5000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /users/v1/{username}:
    get:
      summary: Display user details
      operationId: api_views.users.get_by_username
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: User found
        '404':
          description: User not found
    delete:
      summary: Delete user
      operationId: api_views.users.delete_user
      security:
      - bearerAuth: []
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: User deleted
        '401':
          description: Unauthorized
